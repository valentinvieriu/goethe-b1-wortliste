<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goethe Zertifikat B1 Wortliste</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'goethe-blue': '#005AA0',
              'goethe-light': '#E8F4FD',
            },
          },
        },
      }
    </script>
    <script type="module">
      import { LitElement, html, css } from 'https://unpkg.com/lit@3/index.js?module';

      class GoetheVocabularyApp extends LitElement {
        static properties = {
          allData: { type: Array },
          filteredData: { type: Array },
          filter: { type: String },
          metadata: { type: Object },
          currentPage: { type: String },
          loading: { type: Boolean },
          error: { type: String }
        };

        createRenderRoot() {
          // Use Light DOM instead of Shadow DOM to inherit Tailwind styles
          return this;
        }

        constructor() {
          super();
          this.allData = [];
          this.filteredData = [];
          this.filter = '';
          this.metadata = { version: '', generatedAt: '' };
          this.currentPage = 'all';
          this.loading = true;
          this.error = '';
          this.PDF_URL = 'https://web.archive.org/web/20250601000000/https://www.goethe.de/pro/relaunch/prf/de/Goethe-Zertifikat_B1_Wortliste.pdf';
          this.PDF_FILE = 'Goethe-Zertifikat_B1_Wortliste.pdf';
        }

        firstUpdated() {
          this.loadPage('all');
        }

        parseCSV(csvText) {
          const lines = csvText.split('\n');
          const data = [];
          let metadata = {};
          
          if (lines.length === 0) return { data: [], metadata };

          // Parse header line for metadata
          const headerMatch = lines[0].match(/^"([^"]+)","Version ([^"]+)"$/);
          if (headerMatch) {
            metadata = {
              title: headerMatch[1],
              version: headerMatch[2],
            };
            lines.shift();
          }

          let record = '';
          
          const processRecord = rec => {
            const fields = [];
            let current = '';
            let inQuotes = false;
            
            for (let j = 0; j < rec.length; j++) {
              const ch = rec[j];
              const nextCh = rec[j + 1];
              
              if (ch === '"') {
                if (inQuotes && nextCh === '"') {
                  current += '"';
                  j++;
                } else {
                  inQuotes = !inQuotes;
                }
              } else if (ch === ',' && !inQuotes) {
                fields.push(current);
                current = '';
              } else {
                current += ch;
              }
            }
            
            fields.push(current);
            if (fields.length >= 2) {
              data.push({
                definition: fields[0],
                example: fields[1],
              });
            }
          };

          // Accumulate lines until we have balanced quotes
          for (const line of lines) {
            record = record ? record + '\n' + line : line;
            const quoteCount = (record.match(/"/g) || []).length;
            
            if (quoteCount % 2 === 0) {
              if (record.trim()) processRecord(record);
              record = '';
            }
          }

          return { data, metadata };
        }

        async loadPage(page) {
          this.currentPage = page;
          this.loading = true;
          this.error = '';
          
          const csvFile = page === 'all' ? 'all.csv' : `${page.padStart(3, '0')}.csv`;

          try {
            const response = await fetch(csvFile);
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const csvText = await response.text();
            const { data, metadata } = this.parseCSV(csvText);

            this.allData = data;
            this.filteredData = data;
            this.metadata = metadata;
            this.filter = '';
            this.loading = false;
          } catch (error) {
            console.error('Failed to load vocabulary data:', error);
            this.error = `Failed to load vocabulary data: ${error.message}`;
            this.loading = false;
          }
        }

        updateFilter(newFilter) {
          this.filter = newFilter.toLowerCase();
          this.filteredData = this.allData.filter(
            item =>
              item.definition.toLowerCase().includes(this.filter) || 
              item.example.toLowerCase().includes(this.filter)
          );
        }

        handleSearchInput(e) {
          this.updateFilter(e.target.value);
        }

        handlePageChange(e) {
          this.loadPage(e.target.value);
        }

        escapeHtml(text) {
          if (!text) return '';
          return text.replace(/[&<>"']/g, match => {
            const escape = {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            };
            return escape[match];
          });
        }

        renderLoadingState() {
          return html`
            <div class="bg-white rounded-lg shadow-lg overflow-hidden text-center py-12">
              <div class="text-goethe-blue">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-goethe-blue mx-auto mb-4"></div>
                <h1 class="text-xl font-medium">
                  Loading ${this.currentPage === 'all' ? 'all pages' : 'page ' + this.currentPage}...
                </h1>
              </div>
            </div>
          `;
        }

        renderErrorState() {
          const csvFile = this.currentPage === 'all' ? 'all.csv' : `${this.currentPage.padStart(3, '0')}.csv`;
          return html`
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
              <div class="bg-red-100 border border-red-400 text-red-700 px-6 py-8 text-center">
                <h1 class="text-2xl font-bold mb-2">Error Loading Data</h1>
                <p>${this.error}</p>
                <p class="text-sm mt-2">Make sure the ${csvFile} file is available.</p>
                <p class="text-xs mt-2 text-gray-600">Check browser console for details.</p>
              </div>
            </div>
          `;
        }

        renderPageOptions() {
          const options = [];
          options.push(html`<option value="all" ?selected=${this.currentPage === 'all'}>All Pages</option>`);
          
          for (let i = 16; i <= 102; i++) {
            options.push(html`
              <option value="${i}" ?selected=${this.currentPage == i}>Page ${i}</option>
            `);
          }
          
          return options;
        }

        renderTableRows() {
          if (this.filteredData.length === 0 && this.filter) {
            return html`
              <tr>
                <td colspan="2" class="px-6 py-12 text-center">
                  <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 12h6m-6-4h6m2 5.291A7.962 7.962 0 0112 15c-2.34 0-4.441.935-6 2.461m0 0V21m6-6h.01M6 21h12a2 2 0 002-2V5a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                  </svg>
                  <h3 class="mt-4 text-lg font-medium text-gray-900">No entries found</h3>
                  <p class="mt-2 text-gray-500">Try adjusting your search terms.</p>
                </td>
              </tr>
            `;
          }

          return this.filteredData.map((item, index) => {
            const bgClass = index % 2 === 0 ? 'bg-white' : 'bg-gray-50';
            return html`
              <tr class="${bgClass} hover:bg-blue-50 transition-colors">
                <td class="px-6 py-4 text-sm text-gray-900 whitespace-pre-line align-top leading-relaxed">
                  ${this.escapeHtml(item.definition)}
                </td>
                <td class="px-6 py-4 text-sm text-gray-700 whitespace-pre-line align-top leading-relaxed">
                  ${this.escapeHtml(item.example)}
                </td>
              </tr>
            `;
          });
        }

        renderMainContent() {
          return html`
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
              <!-- Header -->
              <div class="bg-goethe-blue text-white px-6 py-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                  <div class="flex-1">
                    <h1 class="text-3xl md:text-4xl font-bold mb-2">Goethe Zertifikat B1 Wortliste</h1>
                    <p class="text-goethe-light text-sm opacity-90">${this.escapeHtml(this.metadata.version)}</p>
                    <h2 class="text-xl md:text-2xl font-semibold mt-4 text-white">
                      ${this.currentPage === 'all' ? 'Pages 16-102 (Complete)' : `Page ${parseInt(this.currentPage)}`}
                    </h2>
                  </div>
                  <div class="text-right">
                    <label for="page-select" class="block text-sm font-medium text-goethe-light mb-2">Select Page</label>
                    <select
                      id="page-select"
                      class="px-3 py-2 border border-goethe-light rounded-md bg-white text-gray-900 focus:ring-2 focus:ring-white focus:border-white"
                      @change=${this.handlePageChange}
                    >
                      ${this.renderPageOptions()}
                    </select>
                  </div>
                </div>
              </div>

              <!-- Search and Stats -->
              <div class="px-6 py-6 bg-goethe-light border-b">
                <div class="flex flex-col md:flex-row md:items-center gap-4">
                  <div class="flex-1">
                    <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Search vocabulary</label>
                    <div class="relative">
                      <input
                        id="search"
                        type="text"
                        placeholder="Search definitions and examples..."
                        class="w-full px-4 py-3 pl-10 border border-gray-300 rounded-md focus:ring-2 focus:ring-goethe-blue focus:border-goethe-blue transition-colors"
                        @input=${this.handleSearchInput}
                        .value=${this.filter}
                      />
                      <svg class="absolute left-3 top-3.5 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                      </svg>
                    </div>
                  </div>
                  <div class="text-center md:text-right">
                    <div class="text-2xl font-bold text-goethe-blue">${this.filteredData.length}</div>
                    <div class="text-sm text-gray-600">${this.filteredData.length === 1 ? 'entry' : 'entries'}</div>
                    ${this.filter ? html`<div class="text-xs text-gray-500 mt-1">of ${this.allData.length} total</div>` : ''}
                  </div>
                </div>
              </div>

              <!-- Table -->
              <div class="overflow-x-auto">
                <table class="w-full divide-y divide-gray-200">
                  <thead class="bg-gray-50">
                    <tr>
                      <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/2">
                        Definition
                      </th>
                      <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-1/2">
                        Example
                      </th>
                    </tr>
                  </thead>
                  <tbody class="bg-white divide-y divide-gray-200">
                    ${this.renderTableRows()}
                  </tbody>
                </table>
              </div>

              <!-- Footer -->
              <div class="px-6 py-6 bg-gray-50 border-t space-y-3 text-sm text-gray-600">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                  <div class="space-y-2">
                    <p>
                      All text extracted from
                      <a href="${this.PDF_URL}" class="text-goethe-blue hover:underline font-medium">${this.PDF_FILE}</a>
                      (© 2016 Goethe-Institut und ÖSD) for flashcard creation.
                    </p>
                    <p>
                      Read about
                      <a href="https://wejn.org/2023/12/extracting-data-from-goethe-zertifikat-b1-wortliste/" class="text-goethe-blue hover:underline font-medium">
                        the extraction process
                      </a>
                      on the developer's blog.
                    </p>
                  </div>
                  <div class="text-right">
                    <a
                      href="all.csv"
                      download="goethe-b1-wortliste.csv"
                      class="inline-flex items-center px-4 py-2 text-sm font-medium text-goethe-blue hover:bg-goethe-blue hover:text-white transition-colors rounded-md border border-goethe-blue"
                    >
                      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                      </svg>
                      Download CSV
                    </a>
                  </div>
                </div>
                <p class="text-xs text-gray-500">
                  For personal use only. Commercial use of this data is not recommended.
                </p>
              </div>
            </div>
          `;
        }

        render() {
          if (this.loading) {
            return this.renderLoadingState();
          }

          if (this.error) {
            return this.renderErrorState();
          }

          return this.renderMainContent();
        }
      }

      customElements.define('goethe-vocabulary-app', GoetheVocabularyApp);
    </script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
      <goethe-vocabulary-app></goethe-vocabulary-app>
    </div>
  </body>
</html>
